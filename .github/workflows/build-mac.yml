name: Build NEXOO Cloud (.dmg)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: NEXOO-Cloud/package-lock.json

      - name: Install dependencies
        run: |
          cd NEXOO-Cloud
          npm install

      - name: Build macOS DMG
        run: |
          cd NEXOO-Cloud
          npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXOO-Cloud-macOS-DMG
          path: NEXOO-Cloud/dist/*.dmg
